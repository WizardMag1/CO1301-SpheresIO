<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="100%" height="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1050" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="38" font-size="24" font-weight="bold" fill="#1e293b">CO1035 / CO1301 Spheres.io — State Transition Diagram (FSMs)</text>

  <!-- ================= SECTION 1: EGameState ================= -->
  <rect x="25" y="55" width="1550" height="520" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="40" y="82" font-size="16" font-weight="bold" fill="#1e293b">1. Main Game State Machine (enum EGameState)</text>

  <!-- Start Node -->
  <circle cx="74" cy="239" r="14" fill="#000000"/>
  <text x="56" y="272" font-size="13" font-weight="bold" fill="#1e293b">Start</text>
  <line x1="88" y1="239" x2="175" y2="239" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Playing State Box -->
  <g>
    <rect x="175" y="140" width="360" height="210" fill="#eff6ff" stroke="#334155" stroke-width="2.5"/>
    <rect x="175" y="140" width="360" height="34" fill="#2563eb" stroke="#334155" stroke-width="2.5"/>
    <text x="355" y="163" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Playing</text>
    <text x="187" y="195" font-size="13" fill="#1e293b">• Move player sphere (W/S/A/D &amp; Mouse)</text>
    <text x="187" y="217" font-size="13" fill="#1e293b">• Update active camera (TopDown / Iso / Third)</text>
    <text x="187" y="239" font-size="13" fill="#1e293b">• Move active AI bots toward nearest item</text>
    <text x="187" y="261" font-size="13" fill="#1e293b">• Rotate 36 items &amp; check SphereToBox pickups</text>
    <text x="187" y="283" font-size="13" fill="#1e293b">• Update Hyper Mode magnet &amp; countdown</text>
    <text x="187" y="305" font-size="13" fill="#1e293b">• Resolve Player vs Bot collisions &amp; leaderboard</text>
    <text x="187" y="327" font-size="13" fill="#1e293b">• Draw sorted colour-coded Leaderboard HUD</text>
  </g>

  <!-- Paused State Box -->
  <g>
    <rect x="780" y="95" width="340" height="130" fill="#fefce8" stroke="#334155" stroke-width="2.5"/>
    <rect x="780" y="95" width="340" height="34" fill="#ca8a04" stroke="#334155" stroke-width="2.5"/>
    <text x="950" y="118" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Paused</text>
    <text x="792" y="150" font-size="13" fill="#1e293b">• Freeze all player, bot, and item movement</text>
    <text x="792" y="172" font-size="13" fill="#1e293b">• Pause Hyper Mode countdown timer</text>
    <text x="792" y="194" font-size="13" fill="#1e293b">• Display 'PAUSED - Press P to Resume' at top</text>
    <text x="792" y="216" font-size="13" fill="#1e293b">• Keep Leaderboard HUD visible</text>
  </g>

  <!-- Playing <-> Paused Arrows -->
  <line x1="535" y1="165" x2="780" y2="145" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="655" y="143" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">KeyHit(Key_P)</text>
  <line x1="780" y1="190" x2="535" y2="210" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="655" y="220" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">KeyHit(Key_P)</text>

  <!-- GameWon State Box -->
  <g>
    <rect x="780" y="265" width="340" height="125" fill="#f0fdf4" stroke="#334155" stroke-width="2.5"/>
    <rect x="780" y="265" width="340" height="34" fill="#16a34a" stroke="#334155" stroke-width="2.5"/>
    <text x="950" y="288" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">GameWon</text>
    <text x="792" y="322" font-size="13" fill="#1e293b">• Freeze player movement &amp; AI bots</text>
    <text x="792" y="344" font-size="13" fill="#1e293b">• Display 'Congrats, You WON!' in center</text>
    <text x="792" y="366" font-size="13" fill="#1e293b">• Keep final Leaderboard rankings on screen</text>
  </g>

  <line x1="535" y1="275" x2="780" y2="315" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="560" y="268" font-size="13" font-weight="bold" fill="#15803d">playerPoints &gt;= 500 OR</text>
  <text x="560" y="286" font-size="13" font-weight="bold" fill="#15803d">enemiesSwallowed &gt;= 5</text>

  <!-- GameOver State Box -->
  <g>
    <rect x="780" y="415" width="370" height="140" fill="#fef2f2" stroke="#334155" stroke-width="2.5"/>
    <rect x="780" y="415" width="370" height="34" fill="#dc2626" stroke="#334155" stroke-width="2.5"/>
    <text x="965" y="438" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">GameOver</text>
    <text x="792" y="470" font-size="13" fill="#1e293b">• Disable player movement (hide player if eaten)</text>
    <text x="792" y="492" font-size="13" fill="#1e293b">• Display 'Game Over' message in screen center</text>
    <text x="792" y="514" font-size="13" fill="#1e293b">• Remaining AI bots CONTINUE moving &amp; eating items</text>
    <text x="792" y="536" font-size="13" fill="#1e293b">• Update Leaderboard live as bots score</text>
  </g>

  <line x1="420" y1="350" x2="780" y2="475" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="210" y="405" width="520" height="22" fill="#ffffff"/>
  <text x="470" y="421" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Water border (|X|&gt;300 or |Z|&gt;300) OR Bot &gt;= 500 pts OR Eaten by Bot (diff &lt; -40)</text>

  <!-- Engine Stop / Quit Node -->
  <circle cx="1407" cy="292" r="22" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <circle cx="1407" cy="292" r="12" fill="#000000"/>
  <text x="1407" y="338" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Engine Stop / Quit</text>
  <text x="1407" y="358" font-size="13" fill="#1e293b" text-anchor="middle">(myEngine-&gt;Stop())</text>

  <line x1="1120" y1="160" x2="1385" y2="280" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="1120" y1="325" x2="1385" y2="292" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <line x1="1150" y1="480" x2="1385" y2="305" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="1150" y="200" width="245" height="22" fill="#ffffff"/>
  <text x="1272" y="216" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">KeyHit(Key_Escape) [From ANY State]</text>

  <!-- ================= SECTION 2: ESphereState & NPC States ================= -->
  <rect x="25" y="595" width="760" height="430" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="40" y="622" font-size="16" font-weight="bold" fill="#1e293b">2. Player Sphere Sub-State Machine (enum ESphereState)</text>

  <g>
    <rect x="45" y="655" width="265" height="160" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <rect x="45" y="655" width="265" height="34" fill="#475569" stroke="#334155" stroke-width="2.5"/>
    <text x="177" y="678" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Regular</text>
    <text x="57" y="712" font-size="13" fill="#1e293b">• Skin: regularsphere.jpg</text>
    <text x="57" y="734" font-size="13" fill="#1e293b">• Normal SphereToBox pickup</text>
    <text x="57" y="756" font-size="13" fill="#1e293b">• Grow x1.2 every 80 points</text>
    <text x="57" y="778" font-size="13" fill="#1e293b">• Swallow bot if diff &gt; 40</text>
  </g>

  <g>
    <rect x="490" y="655" width="275" height="160" fill="#fdf4ff" stroke="#334155" stroke-width="2.5"/>
    <rect x="490" y="655" width="275" height="34" fill="#c026d3" stroke="#334155" stroke-width="2.5"/>
    <text x="627" y="678" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Hyper</text>
    <text x="502" y="712" font-size="13" fill="#1e293b">• Skin: hypersphere.jpg</text>
    <text x="502" y="734" font-size="13" fill="#1e293b">• hyperTimer = 8.0s countdown</text>
    <text x="502" y="756" font-size="13" fill="#1e293b">• Attract items within 80 units</text>
    <text x="502" y="778" font-size="13" fill="#1e293b">• Draw 'HYPER MAGNET ON' HUD</text>
  </g>

  <line x1="310" y1="710" x2="490" y2="710" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="400" y="680" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Touch HyperCube OR</text>
  <text x="400" y="698" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">playerPoints == 240</text>

  <line x1="490" y1="770" x2="310" y2="770" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="400" y="792" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">hyperTimer &lt;= 0</text>

  <!-- NPC Bot States Box -->
  <g>
    <rect x="45" y="840" width="720" height="165" fill="#f0fdfa" stroke="#334155" stroke-width="2.5"/>
    <rect x="45" y="840" width="720" height="34" fill="#0f766e" stroke="#334155" stroke-width="2.5"/>
    <text x="405" y="863" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">NPC Bot States &amp; Collision Resolution (5 Unique Colour Bots)</text>
    <text x="57" y="896" font-size="13" fill="#1e293b">• Active (enemyActive[enemyNum] == true): Scans 36 items, moves to shortestDist item, grows x1.2 every 80 pts</text>
    <text x="57" y="920" font-size="13" fill="#1e293b">• Collision Bounce (|pointDiff| &lt;= 40): Player and Bot push apart by 15 units along collision vector</text>
    <text x="57" y="944" font-size="13" fill="#1e293b">• Player Swallows Bot (pointDiff &gt; 40): Player earns +40 pts, scales x1.2; Bot transitions to Inactive</text>
    <text x="57" y="968" font-size="13" fill="#1e293b">• Swallowed / Inactive (enemyActive[enemyNum] == false): Bot hidden at Y = -200, stops moving &amp; colliding</text>
  </g>

  <!-- ================= SECTION 3: ECameraState ================= -->
  <rect x="810" y="595" width="765" height="430" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="825" y="622" font-size="16" font-weight="bold" fill="#1e293b">3. Camera View Sub-State Machine (enum ECameraState)</text>

  <g>
    <rect x="835" y="655" width="320" height="135" fill="#eff6ff" stroke="#334155" stroke-width="2.5"/>
    <rect x="835" y="655" width="320" height="34" fill="#2563eb" stroke="#334155" stroke-width="2.5"/>
    <text x="995" y="678" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ThirdView (Default)</text>
    <text x="847" y="712" font-size="13" fill="#1e293b">• Follows player at (playerX, 65, playerZ-90)</text>
    <text x="847" y="734" font-size="13" fill="#1e293b">• Rotated 32 deg about local X-axis</text>
    <text x="847" y="756" font-size="13" fill="#1e293b">• Updates automatically with player movement</text>
  </g>

  <g>
    <rect x="1235" y="655" width="320" height="135" fill="#eef2ff" stroke="#334155" stroke-width="2.5"/>
    <rect x="1235" y="655" width="320" height="34" fill="#4f46e5" stroke="#334155" stroke-width="2.5"/>
    <text x="1395" y="678" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">TopDown</text>
    <text x="1247" y="712" font-size="13" fill="#1e293b">• Positioned at (0, 500, 0), Rotated 90 deg X</text>
    <text x="1247" y="734" font-size="13" fill="#1e293b">• Arrow Keys pan camera along World X / Z</text>
    <text x="1247" y="756" font-size="13" fill="#1e293b">• Full overhead view of island</text>
  </g>

  <g>
    <rect x="1035" y="860" width="320" height="135" fill="#f5f3ff" stroke="#334155" stroke-width="2.5"/>
    <rect x="1035" y="860" width="320" height="34" fill="#7c3aed" stroke="#334155" stroke-width="2.5"/>
    <text x="1195" y="883" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Isometric</text>
    <text x="1047" y="917" font-size="13" fill="#1e293b">• Positioned at (350, 350, -350)</text>
    <text x="1047" y="939" font-size="13" fill="#1e293b">• Rotated -45 deg Y, then +45 deg X</text>
    <text x="1047" y="961" font-size="13" fill="#1e293b">• Fixed angled view (Arrow keys disabled)</text>
  </g>

  <line x1="1155" y1="705" x2="1235" y2="705" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1195" y="695" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Key_1</text>
  <line x1="1235" y1="745" x2="1155" y2="745" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1195" y="765" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Key_3</text>

  <line x1="995" y1="790" x2="1115" y2="860" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1028" y="842" font-size="13" font-weight="bold" fill="#1e293b">Key_2</text>
  <line x1="1145" y1="860" x2="1035" y2="790" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1102" y="820" font-size="13" font-weight="bold" fill="#1e293b">Key_3</text>

  <line x1="1385" y1="790" x2="1275" y2="860" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1348" y="842" font-size="13" font-weight="bold" fill="#1e293b">Key_2</text>
  <line x1="1245" y1="860" x2="1345" y2="790" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1265" y="820" font-size="13" font-weight="bold" fill="#1e293b">Key_1</text>
</svg>
